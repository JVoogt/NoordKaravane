# www is a duplicate of the apex: one permanent redirect so Google indexes (and shows the
# favicon for) a single hostname. TLS is terminated upstream (Cloudflare + Traefik).
server {
    listen 80;
    server_name www.noordkaravane.co.za;
    return 301 https://noordkaravane.co.za$request_uri;
}

# default_server: health checks and direct-port tests (deploy.sh curls localhost:8260) arrive with
# Host values other than the public names and must get the site, not a redirect.
server {
    listen 80 default_server;
    server_name noordkaravane.co.za;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Favicons must be real files. Without this the catch-all above answers a missing
    # /favicon.ico (or apple-touch icon) with the HTML page and a 200, and Google shows a globe.
    # Use `expires` only: any add_header here would drop the server-level security headers.
    location ~ ^/(favicon\.ico|favicon-\d+\.png|apple-touch-icon\.png)$ {
        try_files $uri =404;
        expires 1d;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
        expires 1h;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap.xml =404;
        expires 1h;
    }

    # Static assets with long cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/css
        text/plain
        application/xml
        application/javascript
        application/json
        image/svg+xml
        font/woff2;
}
