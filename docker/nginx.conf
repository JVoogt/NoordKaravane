# www is a duplicate of the apex: one permanent redirect so Google indexes (and shows the
# favicon for) a single hostname. TLS is terminated upstream (Cloudflare + Traefik).
server {
    listen 80;
    server_name www.noordkaravane.co.za;
    return 301 https://noordkaravane.co.za$request_uri;
}

# default_server: health checks and direct-port tests (deploy.sh curls localhost:8260) arrive with
# Host values other than the public names and must get the site, not a redirect.
server {
    listen 80 default_server;
    server_name noordkaravane.co.za;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Static Astro site (directory format): real 404 page, no SPA catch-all.
    error_page 404 /404.html;
    # A bare directory such as /services/ has no index.html, so nginx answers 403: show the 404 page instead.
    error_page 403 =404 /404.html;

    # Security headers (shared snippet; repeated inside every location that sets its own add_header).
    include /etc/nginx/snippets/security-headers.conf;

    # HTML (and the 404 page) must revalidate: it references hashed CSS that is deleted on every redeploy.
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Slashless paths 301 to the slash form (relative Location, see absolute_redirect).
    # Whitelist only: a permissive pattern reflected a decoded %5C into Location (`/\evil/`), which browsers
    # read as `//evil` (open redirect). Anything outside [A-Za-z0-9_-] segments falls through to the 404 page.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        rewrite ^(/[A-Za-z0-9_-]+(?:/[A-Za-z0-9_-]+)*)$ $1/ permanent;
        try_files $uri $uri/index.html =404;
    }

    # Favicons must be real files. Without this a missing /favicon.ico would fall through to the 404 page
    # only by luck of the catch-all, and Google shows a globe for an HTML answer.
    # Use `expires` only: any add_header here would drop the server-level security headers.
    location ~ ^/(favicon\.ico|favicon-\d+\.png|apple-touch-icon\.png)$ {
        try_files $uri =404;
        expires 1d;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
        expires 1h;
    }

    # Old URL kept alive: the sitemap index is the new entry point (internal rewrite, no redirect).
    location = /sitemap.xml {
        rewrite ^ /sitemap-index.xml last;
    }

    # Old second sitemap name.
    location = /sitemap-main.xml {
        return 301 /sitemap-0.xml;
    }

    # Hashed build assets: cache forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Stable, non-hashed names (logo, og image): no immutable, and `expires` only so headers are inherited.
    location /assets/ {
        expires 7d;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/css
        text/plain
        text/javascript
        application/xml
        application/javascript
        application/json
        image/svg+xml
        font/woff2;
}
