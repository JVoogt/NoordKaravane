<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Noord Karavane share image: shop</title>
<link rel="stylesheet" href="og.css">
<style>
  .canvas { background: var(--ground); color: var(--ink); }
  /* The shelf: five real products standing on a tread strip. The middle three sit inside the square crop. */
  .shelf { position: absolute; left: 0; right: 0; top: 0; height: 322px; display: grid;
    grid-template-columns: 285px 210px 210px 210px 285px; align-items: end; justify-items: center; padding-bottom: 6px; }
  .shelf { background: #f4f5f2; }
  .shelf img { object-fit: contain; }
  .shelf img.white { mix-blend-mode: multiply; }
  .tread { position: absolute; left: 0; right: 0; top: 322px; height: 14px; }
  .panel { position: absolute; left: 0; right: 0; top: 336px; bottom: 0; background: var(--ink); color: #fdfdfb;
    display: grid; grid-template-columns: 285px 630px 285px; align-items: center; }
  .mid { text-align: center; }
  h1 { font-size: 76px; white-space: nowrap; }
  .what { margin-top: 10px; font-size: 25px; font-weight: 500; color: var(--paper); }
  .url { display: inline-block; margin-top: 20px; background: var(--orange); color: var(--ink); font-weight: 600; font-size: 26px; padding: 9px 22px 10px; }
  .side { font-size: 19px; font-weight: 500; line-height: 1.3; color: #b8b3aa; }
  .side.l { padding-left: 40px; }
  .side.l img { width: 168px; height: 168px; display: block; }
  .side.r { padding: 0 40px 0 50px; text-align: right; }
  .side.r b { display: block; font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 34px; line-height: 1; color: var(--orange-hi); margin-bottom: 8px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="shelf">
    <img src="../../storefront/public/products/hotrods-gto-braai-grid-plus-stand-in-carry-bag-1.webp" style="width:262px;height:262px" alt="">
    <img src="../../storefront/public/products/lumeno-battery-box-with-mppt-1.webp" style="width:232px;height:232px" alt="">
    <img src="../../storefront/public/products/campsite-first-aid-kit-1.webp" class="white" style="width:226px;height:226px" alt="">
    <img src="../../storefront/public/products/lumeno-27w-led-work-light-1.webp" style="width:232px;height:232px" alt="">
    <img src="../../storefront/public/products/maxi-towing-mirror-1.webp" style="width:262px;height:262px" alt="">
  </div>
  <div class="tread"></div>
  <div class="panel">
    <div class="side l"><img src="../logo-white.png" alt=""></div>
    <div class="mid">
      <h1 class="display">Caravan &amp; camping gear</h1>
      <p class="what">Batteries, solar, lights, water pumps, towing and braai</p>
      <span class="url">Shop at noordkaravane.co.za/shop</span>
    </div>
    <div class="side r"><b>Picked by the workshop</b>From a working caravan workshop in Pretoria North</div>
  </div>
</div>
</body>
</html>
