services:
  noordkaravane:
    build:
      context: ./web
    # NK_WEB_IMAGE is only set by deploy.sh to roll back to the previous image; normal runs use :latest.
    image: ${NK_WEB_IMAGE:-noordkaravane-web:latest}
    container_name: noordkaravane
    restart: unless-stopped
    ports:
      - "8260:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
