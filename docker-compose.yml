# Fixed project name: it cannot collide with the shop stack (nkshop) whatever the clone directory is called.
name: noordkaravane

services:
  noordkaravane:
    build:
      context: ./web
      additional_contexts:
        nkdocker: ./docker
    image: noordkaravane-web:${NK_IMAGE_TAG:-latest}
    container_name: noordkaravane
    restart: unless-stopped
    ports:
      - "8260:80"
